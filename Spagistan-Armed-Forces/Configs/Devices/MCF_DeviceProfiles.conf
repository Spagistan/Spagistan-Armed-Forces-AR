       m_sHeading "react_to_contact.pdf"
       m_sBody "The following steps are to be done without order or signal. The situation can develop into several courses of action I.e., Attack, Break Contact, etc."\
       ""\
       "Conditions:"\
       "The unit (squad, platoon) is stationary or moving, conducting operations, when the enemy initiates contact with a direct-fire weapon."\
       ""\
       "Soldiers under direct fire immediately return fire and seek the nearest covered positions. Then, they call out distances and the orientation of direct fire."\
       ""\
       "Element leaders in contact issue fire commands and control soldiers fire."\
       ""\
       "Soldiers not in contact take cover and provide rear and flank security to ensure the entire unit does not get enveloped."\
       ""\
       "Soldiers maintain contact (visual or oral) with their battle buddies."\
       ""\
       "The unit leader (Squad/Platoon Leader) moves to a position where they can assess the situation. They must be sure to not become decisively engaged or pinned down themselves."\
       ""\
       "The unit leader may consider the following:"\
       "   - Do we have fire superiority?"\
       "   - Where is the enemy located?"\
       "   - What is the size and strength of the enemy force?"\
       "   - Is there a covered and concealed route to the enemy's flank?"\
       ""\
       "The unit leader will decide to:"\
       "   1. Assault the enemy using fire and maneuver"\
       "   2. Destroy the enemy using fire support (if timely and available)"\
       "   3. Break Contact from the enemy"\
       "   4. Assume a support by fire position for a higher-level mission"
       m_sImage "{779C22B5CF80DDF9}Assets/Images/react_to_contact.edds"
      }
      MCF_Device_Item "{6A7D3B4BD986DE91}" {
       m_sHeading "squad_column.pdf"
       m_sBody "The squad column is the squad’s main formation for movement unless preparing for an assault. It provides good dispersion both laterally and in-depth without sacrificing control. It also facilitates maneuver. The lead fire team is the base fire team. Squads can move in either a column wedge (squad column-team wedge) or a modified column wedge. A modified column wedge occurs when rough terrain, poor visibility, and other factors require the squad to modify the wedge into a file for control purposes. As the terrain becomes less rugged and control becomes easier, the Soldiers resume their original positions."
       m_sImage "{EFFB921706B66FF3}Assets/Images/squadColumn.edds"
      }
